<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmoCraft - Вход</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }
        .container {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .form-container {
            background-color: rgba(255, 255, 255, 0.02);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 10;
        }
        .form-container h1 {
            margin-bottom: 10px;
            text-align: center;
            color: #ffd700;
            font-size: 32px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #888;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 6px;
            background-color: rgba(255, 255, 255, 0.03);
            color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        input:focus {
            outline: 2px solid #44aaff;
            outline-offset: 2px;
        }
        input.error {
            border: 1px solid #ff4444;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #111;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #222;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }
        .error-message {
            color: #ff4444;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
        .success-message {
            color: #44ff88;
            font-size: 14px;
            margin-top: 15px;
            text-align: center;
        }
        .link {
            color: #44aaff;
            text-decoration: none;
        }
        .link:hover {
            text-decoration: underline;
        }
        .links {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
        }
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        .stars canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #game-ui {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container" id="loginFormContainer">
            <h1>CosmoCraft</h1>
            <p class="subtitle">Космическая стратегия</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="your.email@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" id="loginBtn">Войти</button>
                <div id="loginMessage"></div>
            </form>
            <div class="links">
                <a href="/registration.html" class="link">Нет аккаунта? Зарегистрироваться</a> | 
                <a href="/password-reset.html" class="link">Забыли пароль?</a>
            </div>
            <div class="footer">© 2026 CosmoCraft</div>
        </div>

        <!-- Игровой интерфейс (скрыт по умолчанию) -->
        <div id="game-ui">
            <!-- Здесь будет игра -->
        </div>

        <div class="stars">
            <canvas id="starfield"></canvas>
        </div>
    </div>

<script>
    // Звёздное небо
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const stars = [];
    const STAR_COUNT = 200;

    for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: Math.random() > 0.9 ? 2 : 1
        });
    }

    function drawStars() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        for (const star of stars) {
            ctx.fillRect(Math.floor(star.x), Math.floor(star.y), star.size, star.size);
        }
    }
    drawStars();

    // Логика входа
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const loginMessage = document.getElementById('loginMessage');
    const loginFormContainer = document.getElementById('loginFormContainer');
    const gameUI = document.getElementById('game-ui');

    // Проверка сохранённой сессии
    const savedToken = localStorage.getItem('accessToken');
    if (savedToken) {
        validateSavedToken();
    }

    async function validateSavedToken() {
        try {
            const response = await fetch('/api/auth/me', {
                headers: {
                    'Authorization': `Bearer ${savedToken}`
                }
            });

            if (response.ok) {
                const data = await response.json();
                if (data.success) {
                    // Токен валиден, показываем игру
                    showGameUI(data.player.username);
                }
            }
        } catch (error) {
            console.error('Ошибка проверки токена:', error);
        }
    }

    loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        loginBtn.disabled = true;
        loginBtn.textContent = 'Вход...';
        loginMessage.innerHTML = '';

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok && data.success) {
                // Сохраняем токены
                localStorage.setItem('accessToken', data.tokens.accessToken);
                localStorage.setItem('refreshToken', data.tokens.refreshToken);

                loginMessage.innerHTML = '<div class="success-message">✅ Вход успешен! Переход в игру...</div>';

                // Получаем информацию о игроке
                setTimeout(async () => {
                    try {
                        const meResponse = await fetch('/api/auth/me', {
                            headers: {
                                'Authorization': `Bearer ${data.tokens.accessToken}`
                            }
                        });

                        if (meResponse.ok) {
                            const meData = await meResponse.json();
                            if (meData.success) {
                                showGameUI(meData.player.username);
                            }
                        }
                    } catch (error) {
                        console.error('Ошибка получения информации:', error);
                        showGameUI('Pilot');
                    }
                }, 500);
            } else {
                let message = data.error || 'Ошибка входа';

                if (data.requiresEmailVerification) {
                    message = `⚠️ ${message}. <a href="/verification.html?email=${encodeURIComponent(email)}" class="link">Подтвердить email</a>`;
                }

                loginMessage.innerHTML = `<div class="error-message" style="display:block">${message}</div>`;
            }
        } catch (error) {
            loginMessage.innerHTML = '<div class="error-message" style="display:block">Ошибка соединения с сервером</div>';
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = 'Войти';
        }
    });

    function showGameUI(username) {
        loginFormContainer.style.display = 'none';
        gameUI.style.display = 'block';
        document.title = `CosmoCraft - ${username}`;

        // Здесь можно инициализировать игру
        console.log('Game UI shown for:', username);

        // Если игра уже импортирована, запускаем её
        if (window.game && typeof window.game.start === 'function') {
            window.game.start();
        }
    }
</script>

<!-- Подключаем игру -->
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import { CosmoCraftGame } from '/dist/client/main.js';

    window.game = new CosmoCraftGame();
</script>

</body>
</html>
