<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmoCraft - Вход</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }
        
        /* Экран авторизации */
        #auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            z-index: 1000;
        }
        
        #auth-screen.hidden {
            display: none;
        }
        
        .login-box {
            background-color: rgba(255, 255, 255, 0.02);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 10;
        }
        
        .login-box h1 {
            margin-bottom: 10px;
            text-align: center;
            color: #ffd700;
            font-size: 32px;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #888;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 6px;
            background-color: rgba(255, 255, 255, 0.03);
            color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        
        .form-group input:focus {
            outline: 2px solid #44aaff;
            outline-offset: 2px;
        }
        
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #111;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .btn-login:hover {
            background-color: #222;
        }
        
        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .links {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
        }
        
        .links a {
            color: #44aaff;
            text-decoration: none;
        }
        
        .links a:hover {
            text-decoration: underline;
        }
        
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }
        
        .error-msg {
            color: #ff4444;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
        
        .success-msg {
            color: #44ff88;
            font-size: 14px;
            margin-top: 15px;
            text-align: center;
        }
        
        /* Звёзды на фоне */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .stars canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        /* Игровой экран */
        #game-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 1;
        }
        
        #game-screen.active {
            display: block;
        }
        
        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
    
    <!-- Import map для Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.183.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.183.1/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <!-- Экран авторизации -->
    <div id="auth-screen">
        <div class="login-box">
            <h1>CosmoCraft</h1>
            <p class="subtitle">Космическая стратегия</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="your.email@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" id="login-btn" class="btn-login">Войти</button>
                <div id="login-msg" class="error-msg"></div>
            </form>
            
            <div class="links">
                <a href="/registration.html">Нет аккаунта? Зарегистрироваться</a> | 
                <a href="/password-reset.html">Забыли пароль?</a>
            </div>
            <div class="footer">© 2026 CosmoCraft</div>
        </div>
        <div class="stars">
            <canvas id="starfield"></canvas>
        </div>
    </div>

    <!-- Игровой экран -->
    <div id="game-screen">
        <canvas id="game-canvas"></canvas>
    </div>

<script>
    // Звёздное небо
    const starCanvas = document.getElementById('starfield');
    const starCtx = starCanvas.getContext('2d');

    function resizeStarCanvas() {
        starCanvas.width = window.innerWidth;
        starCanvas.height = window.innerHeight;
    }
    resizeStarCanvas();
    window.addEventListener('resize', resizeStarCanvas);

    const stars = [];
    for (let i = 0; i < 200; i++) {
        stars.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: Math.random() > 0.9 ? 2 : 1
        });
    }

    function drawStars() {
        starCtx.fillStyle = '#000';
        starCtx.fillRect(0, 0, starCanvas.width, starCanvas.height);
        starCtx.fillStyle = '#fff';
        for (const star of stars) {
            starCtx.fillRect(Math.floor(star.x), Math.floor(star.y), star.size, star.size);
        }
    }
    drawStars();

    // Элементы
    const authScreen = document.getElementById('auth-screen');
    const gameScreen = document.getElementById('game-screen');
    const loginForm = document.getElementById('login-form');
    const loginBtn = document.getElementById('login-btn');
    const loginMsg = document.getElementById('login-msg');

    // Проверка сохранённой сессии
    window.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('accessToken');
        if (token) {
            try {
                const resp = await fetch('/api/auth/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (resp.ok) {
                    const data = await resp.json();
                    if (data.success) {
                        showGame();
                        return;
                    }
                }
                
                // Пробуем обновить токен
                const refresh = localStorage.getItem('refreshToken');
                if (refresh) {
                    const resp2 = await fetch('/api/auth/refresh', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ refreshToken: refresh })
                    });
                    if (resp2.ok) {
                        const data2 = await resp2.json();
                        if (data2.success) {
                            localStorage.setItem('accessToken', data2.tokens.accessToken);
                            localStorage.setItem('refreshToken', data2.tokens.refreshToken);
                            showGame();
                            return;
                        }
                    }
                }
                
                // Сессия невалидна
                localStorage.removeItem('accessToken');
                localStorage.removeItem('refreshToken');
            } catch (e) {
                console.error('Ошибка проверки сессии:', e);
            }
        }
    });

    // Обработка формы входа
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        
        loginMsg.style.display = 'none';
        loginBtn.disabled = true;
        loginBtn.textContent = 'Вход...';
        
        try {
            const resp = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            
            const data = await resp.json();
            
            if (resp.ok && data.success) {
                localStorage.setItem('accessToken', data.tokens.accessToken);
                localStorage.setItem('refreshToken', data.tokens.refreshToken);
                
                loginMsg.className = 'success-msg';
                loginMsg.style.display = 'block';
                loginMsg.textContent = '✅ Вход успешен! Загрузка...';
                
                setTimeout(() => {
                    showGame();
                }, 500);
            } else {
                let msg = data.error || 'Ошибка входа';
                if (data.requiresEmailVerification) {
                    msg = `Подтвердите email. <a href="/verification.html?email=${encodeURIComponent(email)}">Подтвердить</a>`;
                }
                loginMsg.className = 'error-msg';
                loginMsg.style.display = 'block';
                loginMsg.innerHTML = msg;
                loginBtn.disabled = false;
                loginBtn.textContent = 'Войти';
            }
        } catch (err) {
            loginMsg.className = 'error-msg';
            loginMsg.style.display = 'block';
            loginMsg.textContent = 'Ошибка соединения с сервером';
            loginBtn.disabled = false;
            loginBtn.textContent = 'Войти';
        }
    });

    // Показать игру
    function showGame() {
        authScreen.classList.add('hidden');
        gameScreen.classList.add('active');
        document.body.style.overflow = 'hidden';
        
        console.log('Game screen activated');
        
        // Загружаем игру динамически
        loadGame();
    }

    // Загрузка игры
    async function loadGame() {
        try {
            console.log('Loading game module...');
            
            // Динамический импорт
            const module = await import('/dist/client/main.js');
            const CosmoCraftGame = module.CosmoCraftGame;
            
            if (!CosmoCraftGame) {
                console.error('CosmoCraftGame not found in module');
                return;
            }
            
            console.log('Creating game instance...');
            window.game = new CosmoCraftGame();
            
            console.log('Starting game...');
            await window.game.start();
            
            console.log('Game started successfully');
        } catch (error) {
            console.error('Ошибка загрузки игры:', error);
            console.error('Stack:', error.stack);
        }
    }
</script>

</body>
</html>
