<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmoCraft - Космическая стратегия</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Меню логина -->
    <div id="login-overlay">
        <div class="login-box">
            <h1>CosmoCraft</h1>
            <input type="text" id="player-name" placeholder="Введите имя игрока" value="Gora">
            <button id="btn-login">Войти в игру</button>
            <div id="login-status"></div>
        </div>
    </div>

    <!-- Игровой интерфейс -->
    <div id="game-ui" style="display: none;">
        <div id="info">
            <div id="coordinates">X: 0 Y: 0 Z: 0</div>
            <div id="sector">Сектор: Неизвестно</div>
            <div id="temperature">Температура: 0K</div>
            <div id="radiation">Радиация: 0 rad/s</div>
            <div id="resources">
                <div>Металл: <span id="metal">0</span></div>
                <div>Кремний: <span id="silicon">0</span></div>
                <div>Лед: <span id="ice">0</span></div>
                <div>Редкие: <span id="rare">0</span></div>
            </div>
        </div>

        <div id="warning" style="display: none;"></div>

        <div id="build-menu"></div>

        <div id="mining-progress" style="display: none;">
            <div class="progress-bar">
                <div class="progress-fill" id="mining-fill"></div>
            </div>
            <div id="mining-status">Добыча...</div>
        </div>

        <!-- Меню станций -->
        <div id="station-menu" style="display: none;">
            <div id="station-list"></div>
        </div>
    </div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>
    
    <script type="module">
        import { CosmoCraftGame } from '/dist/client/main.js';

        // Определяем функцию login сразу
        window.login = async function() {
            console.log('Login function called');
            const playerName = document.getElementById('player-name').value;
            if (playerName) {
                localStorage.setItem('playerName', playerName);

                // Скрываем меню логина - ВАЖНО: display none
                const loginOverlay = document.getElementById('login-overlay');
                if (loginOverlay) {
                    loginOverlay.style.display = 'none';
                    console.log('Login overlay hidden');
                } else {
                    console.error('Login overlay not found!');
                }

                // Показываем игровой интерфейс
                const gameUI = document.getElementById('game-ui');
                if (gameUI) {
                    gameUI.style.display = 'block';
                    console.log('Game UI shown');
                } else {
                    console.error('Game UI not found!');
                }

                // Создаем и запускаем игру (async)
                if (!window.game) {
                    window.game = new CosmoCraftGame();
                    await window.game.start();
                }
            } else {
                console.error('Player name is empty!');
            }
        };

        // Навешиваем обработчик после загрузки DOM
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOMContentLoaded fired');
            console.log('window.login exists:', typeof window.login === 'function');
            
            const btnLogin = document.getElementById('btn-login');
            console.log('btn-login element:', btnLogin);
            
            if (btnLogin) {
                btnLogin.addEventListener('click', () => {
                    console.log('Login button clicked');
                    console.log('window.login type:', typeof window.login);
                    window.login();
                });
            } else {
                console.error('btn-login not found!');
            }

            // Также позволяем нажать Enter в поле ввода
            const playerNameInput = document.getElementById('player-name');
            if (playerNameInput) {
                playerNameInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        window.login();
                    }
                });
                console.log('player-name input:', playerNameInput.value);
            }
        });
    </script>
</body>
</html>
