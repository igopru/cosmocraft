<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmoCraft - Конструктор (Debug)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; }
        #designer-ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #4466aa;
            pointer-events: none;
            z-index: 100;
        }
        #voxel-palette {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #4466aa;
            pointer-events: all;
            z-index: 100;
            flex-wrap: wrap;
            max-width: 800px;
            justify-content: center;
        }
        .voxel-button {
            width: 60px;
            height: 60px;
            border: 2px solid #666;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .voxel-button:hover {
            transform: scale(1.1);
            border-color: #ffaa33;
        }
        .voxel-button.selected {
            border-color: #ffaa33;
            box-shadow: 0 0 15px #ffaa33;
        }
        #stats-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #4466aa;
            pointer-events: none;
            z-index: 100;
        }
        #controls-panel {
            position: absolute;
            bottom: 100px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #4466aa;
            pointer-events: all;
            z-index: 100;
        }
        button {
            background: #4466aa;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin: 2px;
            font-size: 14px;
        }
        button:hover {
            background: #5577bb;
        }
        hr {
            border-color: #4466aa;
            margin: 10px 0;
        }
        #debug-console {
            position: absolute;
            top: 150px;
            left: 10px;
            background: rgba(0,0,0,0.9);
            color: #0f0;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 11px;
            max-width: 400px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 200;
            pointer-events: all;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.183.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.183.1/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="debug-console">Debug console initialized...</div>
    
    <div id="designer-ui">
        <h2>🛠️ Конструктор</h2>
        <div>Режим: <span id="mode-display">Строительство</span></div>
        <div>Вокселей: <span id="voxel-count">0</span>/262144</div>
    </div>

    <div id="stats-panel">
        <h3>📊 Характеристики</h3>
        <div>Энергия: <span id="power">+0 / -0</span></div>
        <div>Щиты: <span id="shields">0</span></div>
        <div>Груз: <span id="cargo">0</span></div>
        <div>Орудия: <span id="weapons">0</span></div>
        <div>Стоимость: <span id="cost">0</span></div>
    </div>

    <div id="controls-panel">
        <h3>🎮 Управление</h3>
        <button id="mode-place">🔨 Строить</button>
        <button id="mode-remove">❌ Удалить</button>
        <button id="mode-paint">🎨 Красить</button>
        <hr>
        <button id="save-blueprint">💾 Сохранить</button>
        <button id="load-blueprint">📂 Загрузить</button>
        <button id="export-game">🚀 В игру</button>
        <hr>
        <button id="clear-all">🗑️ Очистить</button>
    </div>

    <div id="voxel-palette"></div>

    <input type="file" id="file-input" accept=".blueprint,.json" style="display: none;">

    <script type="module">
        import * as THREE from 'three';
        
        const debug = (msg) => {
            const console = document.getElementById('debug-console');
            console.innerHTML += `<div>${msg}</div>`;
            console.scrollTop = console.scrollHeight;
        };
        
        debug('Creating Three.js scene...');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);
        debug('Scene created');
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(50, 50, 100);
        debug('Camera created at ' + JSON.stringify(camera.position));
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        debug('Renderer created, size: ' + window.innerWidth + 'x' + window.innerHeight);
        
        // Add lights
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        debug('Ambient light added');
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);
        debug('Directional light added');
        
        // Add axes helper
        const axesHelper = new THREE.AxesHelper(50);
        scene.add(axesHelper);
        debug('Axes helper added');
        
        // Add grid helper
        const gridHelper = new THREE.GridHelper(200, 20, 0x4466aa, 0x223355);
        scene.add(gridHelper);
        debug('Grid helper added');
        
        // Test voxel
        debug('Creating test voxel...');
        const geometry = new THREE.BoxGeometry(8, 8, 8);
        const material = new THREE.MeshStandardMaterial({ color: 0x666666 });
        const voxel = new THREE.Mesh(geometry, material);
        voxel.position.set(0, 0, 0);
        scene.add(voxel);
        debug('Test voxel added at ' + JSON.stringify(voxel.position));
        
        // Controls
        const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        debug('OrbitControls initialized');
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        debug('Animation loop started');
        
        debug('✅ Test scene initialized successfully!');
    </script>
</body>
</html>
