# Nginx конфигурация для CosmoCraft
# Скопируйте этот конфиг в /etc/nginx/sites-available/cosmocraft
# Затем создайте симлинк и перезапустите nginx:
#   ln -s /etc/nginx/sites-available/cosmocraft /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name cosmocraft.rupru.ru;

    # SSL сертификаты (укажите ваши пути)
    ssl_certificate /path/to/your/cert.pem;
    ssl_certificate_key /path/to/your/key.pem;

    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Логирование
    access_log /var/log/nginx/cosmocraft_access.log;
    error_log /var/log/nginx/cosmocraft_error.log;

    # Максимальный размер загружаемых файлов
    client_max_body_size 10M;

    # Статические файлы и API (клиентская часть на порту 8001)
    location / {
        proxy_pass http://10.222.0.21:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        
        # CSP - разрешаем WebSocket
        add_header Content-Security-Policy "default-src https: wss: data: 'unsafe-inline' 'unsafe-eval'; connect-src https: wss: data:; script-src https: 'unsafe-inline' 'unsafe-eval'; style-src https: 'unsafe-inline';" always;
    }

    # WebSocket для игрового сервера (порт 8080)
    # Клиенты подключаются через wss://cosmocraft.rupru.ru/ws
    location /ws {
        proxy_pass http://10.222.0.21:8080;
        proxy_http_version 1.1;

        # Заголовки для WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Передача реального IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Таймауты для WebSocket соединения
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Отключаем буферизацию для WebSocket
        proxy_buffering off;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # API для админ-панели
    location /api/admin {
        proxy_pass http://10.222.0.21:8001/api/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Редирект с HTTP на HTTPS
server {
    listen 80;
    server_name cosmocraft.rupru.ru;
    return 301 https://$server_name$request_uri;
}
